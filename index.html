<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keep It Up!</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='44' fill='%23ff4d4d'/></svg>" />
    <style>
      html, body { margin: 0; height: 100%; background: #EFE8DA; overflow: hidden; font-family: monospace; color: #1E1B1A; }
      #game { width: 100%; height: 100%; position: relative; }
      #boot-splash {
        position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 10px;
        background: #EFE8DA; color: #1E1B1A; letter-spacing: 2px; font-weight: 700;
      }
      #boot-splash .title { font-size: 32px; color: #FF48B0; }
      #boot-splash .sub { font-size: 13px; }
    </style>
  </head>
  <body>
    <div id="game">
      <div id="boot-splash">
        <div class="title">KEEP IT UP!</div>
        <div class="sub">WARMING UP RISO PRESS...</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
